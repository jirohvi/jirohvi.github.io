<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#02030c">
<title>My Portfolio | Rain Jiroh C. Policarpio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧩%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#02030c;--bl:#0a4dff;--cy:#47b0ff;--mu:#9fb4d9;--line:rgba(71,176,255,.3);--d:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--b:"Barlow",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:#fff;font:400 1rem/1.7 var(--b);overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px}

/* header + menu */
.hd{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;transition:background .3s}
.hd.solid{background:rgba(2,3,12,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font:800 italic 1.5rem/1 var(--d);letter-spacing:.08em}
.logo::before{content:"";display:inline-block;width:10px;height:1em;margin-right:10px;vertical-align:-.12em;background:var(--bl);transform:skewX(-20deg);box-shadow:0 0 14px var(--bl)}
.dn{display:none;gap:30px}
.dn a{font:700 1rem var(--d);letter-spacing:.2em;padding:4px 0;border-bottom:2px solid transparent}
.dn a:hover,.dn a.on{border-color:var(--cy);color:var(--cy)}
.mb{display:flex;align-items:center;gap:12px;background:none;border:0;color:#fff;font:700 .95rem var(--d);letter-spacing:.2em;cursor:pointer}
.mb i{display:block;width:26px;height:2px;background:#fff;box-shadow:0 7px 0 #fff,0 -7px 0 #fff}
@media(min-width:900px){.dn{display:flex}.mb{display:none}}
.ov{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:center;padding:0 8vw;background:linear-gradient(120deg,var(--bg) 55%,#06154a);transform:translateX(100%);visibility:hidden;transition:transform .45s,visibility .45s}
.ov.open{transform:none;visibility:visible}
.ov a{display:block;font:800 italic clamp(2.6rem,11vw,5rem)/1.2 var(--d);letter-spacing:.04em}
.ov a:hover,.ov a.on{color:var(--cy)}
.ov .x{position:absolute;top:14px;right:20px;background:none;border:0;color:#fff;font:700 .95rem var(--d);letter-spacing:.2em;cursor:pointer}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:96px 7vw 120px;overflow:hidden;background:linear-gradient(112deg,transparent 52%,rgba(10,77,255,.5) 52.2%,transparent 72%),radial-gradient(ellipse at 78% 28%,rgba(10,77,255,.45),transparent 60%),repeating-linear-gradient(90deg,rgba(71,176,255,.05) 0 1px,transparent 1px 60px),var(--bg)}
.hero.sm{min-height:0;padding:130px 7vw 50px}
