<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#02050f">
<title>My Portfolio | Rain Jiroh C. Policarpio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧩%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#02050f;--ink:#dcebff;--blue:#2f8bff;--hi:#8cc8ff;--deep:#0a2a6b;--line:#1f5fd6;--serif:Georgia,"Times New Roman",serif;--disp:"Oswald","Arial Narrow",Impact,sans-serif}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{min-height:100vh;display:flex;flex-direction:column;color:var(--ink);font-family:var(--serif);line-height:1.65;background:radial-gradient(ellipse at 50% 0,rgba(47,139,255,.28),transparent 60%),radial-gradient(ellipse at 50% 100%,rgba(20,80,200,.25),transparent 55%),var(--bg);background-attachment:fixed}
:focus-visible{outline:2px solid var(--hi);outline-offset:3px}
.bgpat{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

/* puzzle piece icons */
.pz{width:68px;height:68px;flex:none;transform:rotate(var(--r,0deg));filter:drop-shadow(0 0 6px var(--blue))}
.pz.sm{width:24px;height:24px}
.pz use{fill:rgba(47,139,255,.15);stroke:var(--hi);stroke-width:2.4;stroke-linejoin:round}

/* header */
header{position:sticky;top:0;z-index:5;padding:14px 16px 0;text-align:center;border-bottom:1px solid var(--line);background:rgba(2,5,15,.88);backdrop-filter:blur(6px)}
.logo{display:inline-flex;align-items:center;gap:10px;font:600 1.35rem var(--disp);letter-spacing:.28em;color:var(--hi);text-shadow:0 0 12px var(--blue);text-decoration:none}
nav{display:flex;justify-content:center;gap:24px;padding:10px 0 12px}
nav a{padding:2px 0;border-bottom:2px solid transparent;font:500 .95rem var(--disp);letter-spacing:.12em;color:var(--hi);text-decoration:none}
nav a:hover,nav a.on{border-color:var(--blue);text-shadow:0 0 10px var(--blue)}

/* layout */
main{flex:1;width:100%;max-width:960px;margin:0 auto;padding:0 18px}
.hero{min-height:68vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:48px 0;text-align:center}
.hero.compact{min-height:0;padding:44px 0 6px;gap:12px}
.eyebrow{font:500 .95rem var(--disp);letter-spacing:.16em;color:var(--hi)}
h1{font:700 clamp(2.4rem,9vw,4.2rem) var(--disp);letter-spacing:.08em;text-shadow:0 0 18px var(--blue),0 0 40px rgba(47,139,255,.5)}
.tag{font-style:italic;font-size:1.15rem;color:var(--hi)}
blockquote{max-width:30ch;font-size:1.2rem;font-style:italic}
